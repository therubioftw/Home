<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not found &middot; @therubio</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d0d1a">
  <link rel="icon" href="/avatar.jpg">
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('/fonts/inter-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
                     U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
                     U+2212, U+2215, U+FEFF, U+FFFD;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d1a; --card: rgba(255,255,255,0.07); --card-hover: rgba(255,255,255,0.12);
      --border: rgba(255,255,255,0.11); --border-hover: rgba(139,92,246,0.5);
      --text: #eef2f8; --muted: #7a8fa6; --accent: #8b5cf6; --glow: rgba(139,92,246,0.3);
    }
    body {
      background: var(--bg); color: var(--text); min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.028) 1px, transparent 1px);
      background-size: 48px 48px; pointer-events: none;
    }
    body::after {
      content: ''; position: fixed; top: -180px; left: 50%; transform: translateX(-50%);
      width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(99,102,241,0.18) 0%, transparent 65%);
      pointer-events: none;
    }
    main { position: relative; text-align: center; max-width: 420px; }
    .code {
      font-size: 4rem; font-weight: 700; letter-spacing: -0.04em; line-height: 1;
      background: linear-gradient(135deg, #f1f5f9 20%, #a5b4fc 80%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    h1 { font-size: 1.05rem; font-weight: 600; margin: 16px 0 8px; }
    p { color: var(--muted); font-size: 0.875rem; line-height: 1.6; }
    a.home {
      display: inline-flex; align-items: center; gap: 9px; margin-top: 26px;
      padding: 11px 18px; border-radius: 12px; text-decoration: none; color: var(--text);
      background: var(--card); border: 1px solid var(--border); font-size: 0.85rem; font-weight: 500;
      transition: background 0.18s, border-color 0.18s, transform 0.18s, box-shadow 0.18s;
    }
    a.home:hover {
      background: var(--card-hover); border-color: var(--border-hover);
      transform: translateY(-2px); box-shadow: 0 6px 24px var(--glow);
    }
    a.home:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>This page doesn&rsquo;t exist</h1>
    <p>The link may be old, or mistyped. Everything I&rsquo;m actually on is one click away.</p>
    <a class="home" href="/">Take me home <span aria-hidden="true">&rsaquo;</span></a>
  </main>
</body>
</html>
